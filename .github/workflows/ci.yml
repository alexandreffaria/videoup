name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # noembed: the upscaler assets are fetched by the build, not committed
      - run: go vet -tags noembed ./...
      - run: go test -tags noembed ./...
